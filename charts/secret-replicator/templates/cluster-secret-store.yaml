---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "secret-replicator.storeName" . }}
  labels:
    {{- include "secret-replicator.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ include "secret-replicator.sourceNamespace" . }}
      server:
        caProvider:
          type: {{ .Values.server.caProvider.type }}
          name: {{ .Values.server.caProvider.name }}
          key: {{ .Values.server.caProvider.key }}
          namespace: {{ include "secret-replicator.caProviderNamespace" . }}
      auth:
        serviceAccount:
          name: {{ include "secret-replicator.serviceAccountName" . }}
          namespace: {{ include "secret-replicator.sourceNamespace" . }}
