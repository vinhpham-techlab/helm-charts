#     refreshInterval: 1m
#     namespaceSelectors:
#       - matchLabels:
#           datalab.vinhdata.io/redpanda-external-cert: "true"
#     target:
#       name: redpanda-external-cert
#       type: kubernetes.io/tls
#     source:
#       key: redpanda-external-cert
replications: []
