serviceAccount:
  create: true
  name: ""

# ClusterSecretStore name. Defaults to "<release-namespace>-k8s".
store:
  name: ""

# Namespace that owns the source secrets.
source:
  namespace: ""

server:
  caProvider:
    type: ConfigMap
    name: kube-root-ca.crt
    key: ca.crt
    namespace: ""

# Example:
